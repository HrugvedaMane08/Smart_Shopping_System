<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Socket.IO Real-Time Test</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
      margin: 0;
    }
    h1 { color: #38bdf8; }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .connected { background: #14532d; color: #4ade80; }
    .disconnected { background: #7f1d1d; color: #f87171; }
    .controls {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .controls label { display: block; margin: 8px 0 4px; font-size: 13px; color: #94a3b8; }
    .controls input, .controls button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    .controls button {
      background: #2563eb;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
      font-weight: 600;
    }
    .controls button:hover { background: #1d4ed8; }
    #log {
      background: #000;
      border-radius: 8px;
      padding: 16px;
      height: 500px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
      font-size: 13px;
    }
    .event-line { margin-bottom: 6px; padding: 6px; border-radius: 4px; }
    .event-productScanned { background: #052e16; color: #86efac; }
    .event-productRemoved { background: #450a0a; color: #fca5a5; }
    .event-cartUpdated { background: #1e1b4b; color: #a5b4fc; }
    .event-inventoryUpdated { background: #422006; color: #fdba74; }
    .event-lowStockAlert { background: #500724; color: #fda4af; }
    .event-transactionCompleted { background: #052e2b; color: #5eead4; }
    .event-cartCreated { background: #1e1b4b; color: #a5b4fc; }
    .event-cartClosed { background: #1e1b4b; color: #a5b4fc; }
    .event-system { color: #64748b; }
    .timestamp { color: #475569; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>🔌 Socket.IO Real-Time Test</h1>
  <div id="connectionStatus" class="status disconnected">Disconnected</div>

  <div class="controls">
    <label>Backend Socket URL</label>
    <input type="text" id="socketUrl" value="http://localhost:5000" style="width: 300px;" />
    <button onclick="connectSocket()">Connect</button>
    <button onclick="joinManagerRoom()">Join Manager Room</button>

    <label>Cart ObjectId (to join a specific cart room — get this from GET /api/carts/my-cart)</label>
    <input type="text" id="cartObjectId" placeholder="e.g. 65f1a2b3c4d5e6f7a8b9c0d1" style="width: 300px;" />
    <button onclick="joinCartRoom()">Join Cart Room</button>

    <button onclick="clearLog()" style="background:#475569;">Clear Log</button>
  </div>

  <div id="log"></div>

  <script>
    let socket = null;
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('connectionStatus');

    function logEvent(eventName, data) {
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = `event-line event-${eventName}`;
      line.innerHTML = `<span class="timestamp">${time}</span><strong>${eventName}</strong><br><pre style="white-space:pre-wrap;margin:4px 0 0;">${JSON.stringify(data, null, 2)}</pre>`;
      logEl.prepend(line);
    }

    function connectSocket() {
      const url = document.getElementById('socketUrl').value;

      if (socket) socket.disconnect();

      socket = io(url);

      socket.on('connect', () => {
        statusEl.textContent = `Connected (${socket.id})`;
        statusEl.className = 'status connected';
        logEvent('system', { message: 'Connected to server' });
      });

      socket.on('disconnect', () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status disconnected';
        logEvent('system', { message: 'Disconnected from server' });
      });

      // Listen to ALL events from your spec
      const events = [
        'productScanned',
        'productRemoved',
        'inventoryUpdated',
        'cartUpdated',
        'lowStockAlert',
        'transactionCompleted',
        'cartCreated',
        'cartClosed',
      ];

      events.forEach((eventName) => {
        socket.on(eventName, (data) => logEvent(eventName, data));
      });
    }

    function joinManagerRoom() {
      if (!socket) return alert('Connect first');
      socket.emit('joinManagerRoom');
      logEvent('system', { message: 'Requested to join managers room' });
    }

    function joinCartRoom() {
      if (!socket) return alert('Connect first');
      const cartObjectId = document.getElementById('cartObjectId').value;
      if (!cartObjectId) return alert('Enter a cart ObjectId first');
      socket.emit('joinCart', cartObjectId);
      logEvent('system', { message: `Requested to join cart_${cartObjectId}` });
    }

    function clearLog() {
      logEl.innerHTML = '';
    }

    // Auto-connect on page load
    connectSocket();
  </script>
</body>
</html>
